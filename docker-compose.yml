services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local-only credentials
      POSTGRES_DB: app
    ports:
      - "5432:5432" # expose so you can connect with a GUI client (DBeaver, pgAdmin)
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Override the production CMD: apply pending migrations, then start with hot reload.
    # (In production, migrations run as a separate deploy step, not on every container start.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside the Compose network, the database's hostname is its service name: `db`.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # mount your source code so edits reload instantly
      # (the image's virtualenv lives at /opt/venv, so this mount doesn't hide it)
    depends_on:
      db:
        condition: service_healthy # wait until Postgres is accepting connections

volumes:
  pgdata:
