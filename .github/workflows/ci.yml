# Continuous integration: runs on every pull request and on pushes to main.
# Three independent jobs run in parallel on fresh GitHub-hosted Ubuntu VMs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow's GITHUB_TOKEN can only read the repo.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that's still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (tags can be moved to point at
# different code); the comment records which release that SHA is.

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres container that lives for this job only — a real database
    # for the tests, in place of the local docker compose `db` service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # CI-only credentials
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.33" # keep in sync with the uv image in backend/Dockerfile
          enable-cache: true # cache downloaded packages between runs, keyed on uv.lock
          cache-dependency-glob: backend/uv.lock

      # --locked: fail if uv.lock is out of date with pyproject.toml (≈ `npm ci`).
      # uv installs the Python version from .python-version automatically.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github . # findings show inline on the PR

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Fails if the models have changes that no migration covers
      # (someone edited a model but forgot `alembic revision --autogenerate`).
      - name: Check models match migrations
        run: uv run alembic check

      # Proves every migration can be undone, then re-applies them for the tests.
      - name: Check migrations round-trip
        run: uv run alembic downgrade base && uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  docker:
    name: Backend image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Buildx is Docker's extended builder; needed for the layer cache below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only (push: false). Phase 5 extends this to push to a container registry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha # reuse unchanged layers from previous runs
          cache-to: type=gha,mode=max
