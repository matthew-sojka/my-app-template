[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the full-stack app template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: core errors, I: import sorting, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
